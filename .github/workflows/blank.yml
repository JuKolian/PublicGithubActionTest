name: CI

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Extract version from XML
      - name: Extract version
        id: version
        run: python3 ./.github/scripts/extract_version.py

      # Show extracted versions
      - name: Show extracted versions
        run: |
          echo "Full version: ${{ steps.version.outputs.version_full }}"
          echo "Major.Minor: ${{ steps.version.outputs.version_minor }}"
          echo "Major only: ${{ steps.version.outputs.version_major }}"

      # Prepare lowercase image name
      - name: Prepare Docker image name
        id: prep
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE"

      # Create Git tags
      - name: Tag versions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          FULL="${{ steps.version.outputs.version_full }}"
          MINOR="${{ steps.version.outputs.version_minor }}"
          MAJOR="${{ steps.version.outputs.version_major }}"

          echo "Full version: $FULL"
          echo "Minor version: $MINOR"
          echo "Major version: $MAJOR"

          # Full version tag
          git tag -f "$FULL"

          # Minor tag
          LAST_MINOR_TAG=$(git tag --list "$MINOR")
          if [ "$LAST_MINOR_TAG" != "$MINOR" ]; then
            echo "Creating new minor tag $MINOR"
            git tag "$MINOR"
          else
            echo "Updating existing minor tag $MINOR"
            git tag -f "$MINOR"
          fi

          # Major tag
          LAST_MAJOR_TAG=$(git tag --list "$MAJOR")
          if [ "$LAST_MAJOR_TAG" != "$MAJOR" ]; then
            echo "Creating new major tag $MAJOR"
            git tag "$MAJOR"
          else
            echo "Updating existing major tag $MAJOR"
            git tag -f "$MAJOR"
          fi

          git push origin --tags --force

      # Login to GHCR
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:${{ steps.version.outputs.version_full }}
            ${{ steps.prep.outputs.image }}:${{ steps.version.outputs.version_minor }}
            ${{ steps.prep.outputs.image }}:${{ steps.version.outputs.version_major }}
            ${{ steps.prep.outputs.image }}:latest
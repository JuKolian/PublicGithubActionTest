name: CI

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: python3 ./.github/scripts/extract_version.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_full }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_minor }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_major }}
            ghcr.io/${{ github.repository }}:latest